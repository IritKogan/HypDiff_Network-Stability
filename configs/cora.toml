# Cora edge-recovery stability experiment (leakage-free, cumulative series).
# Every parameter of the run lives here; the resolved file is saved with the results.
# Decisions: project_context.md, Decisions 1, 2, 4, 5, 6.

[run]
name = "cora_edge_recovery"
output_root = "artifacts/runs"   # override with --output-root (e.g. Google Drive on Colab)
device = "auto"                  # "auto" | "cpu" | "cuda"

[data]
dataset = "Cora"                 # Planetoid Cora, row-normalised features
root = "data"
download = true

[split]
# Edge split, done once. Pool edges are the only edges ever removed and are never
# seen in training (encoder, denoiser, community centres).
seed = 20261116
train_fraction = 0.5
val_fraction = 0.1
pool_fraction = 0.4
# Non-edge control pairs (false-positive reference); never used as training negatives.
control_pairs = 20000

[model]
seed = 20261117
dim = 128                        # encoder sweep 2026-11-16 (val AUC only), see docs/model-selection-cora.md
num_layers = 2
curvature = 1.0
final_activation = "relu"        # "relu" | "leaky_relu"
activation = "relu"              # hidden HGCN activation (torch.nn.functional name)
dropout = 0.7
bias = false
use_attention = false
fermi_dirac_r = 2.0
fermi_dirac_t = 1.0

[autoencoder]
max_epochs = 2000
patience = 200                   # early stopping on validation AUC
learning_rate = 0.01
weight_decay = 0.0005
negatives_per_positive = 1       # resampled every epoch

[denoiser]
# Chosen on validation recovery (docs/model-selection-cora.md, 2026-11-16): residual_gcn +
# edge_reconstruction + clip + train_t_max 8 + one_step sampler. Upstream HypDiff behaviour:
# architecture = "upstream_gcn", training = "generative", train_t_max = 200, sampler = "iterative".
epochs = 5000
learning_rate = 0.001
noise_formula = "exact"          # "exact" | "upstream"  (Decision 5)
architecture = "residual_gcn"    # "upstream_gcn" (HypDiff gcndec) | "residual_gcn" (x0 = x_t + correction)
hidden_dim = 128                 # residual_gcn only
layers = 3                       # residual_gcn only
training = "edge_reconstruction" # "generative" (upstream: denoise noised clean embeddings)
                                 # | "damage_aware" (input: edge-dropped train graph, target: intact train graph)
                                 # | "edge_reconstruction" (BCE through the decoder: dropped + kept train
                                 #   edges vs sampled non-edges, after one denoising step)
train_max_drop = 0.4             # damage_aware / edge_reconstruction: per-epoch drop fraction ~ U(0, train_max_drop) of TRAIN edges
train_t_max = 8                  # timesteps sampled in [0, train_t_max) during training (200 = upstream)
clip_x0 = true                   # upstream clamps predicted x0 to [-1, 1]
radial_delta = 1.0               # radial popularity coefficient (paper Eq. 6); upstream code 1, paper experiments 0.4
# conditional training only (Decision 9): noise the CLEAN train-graph embedding, condition on the damaged one
edge_loss_weight = 1.0           # weight of the decoder BCE (dropped + kept train edges vs non-edges) added to the MSE
t_sampling = "per_graph"         # "per_graph" (one t per training graph) | "per_node" (upstream)
angular_noise = "upstream"       # "upstream": sgn(dir) * eps (paper Eq. 5 / code; statistically isotropic)
parameterization = "direct"      # "direct" (network predicts x0) | "preconditioned" (conditional_residual_gcn only:
                                 #   x0 = c + k_t (y - c) + out_t F, Gaussian prior N(c, v); forces use of x_t)
                                 # | "geometric" (conditional_residual_gcn only: deterministic mean mu(c) + stochastic
                                 #   part in 2 geometric coordinates per node: community offset, popularity)
prior_variance = 0.0             # preconditioned / geometric (initial prior): v = Var(x0 - c); 0 = estimate on training damage
                                 # | "folded": sgn(dir) * |eps| (DDM, paper Eq. C.1; truly direction-restricted)

[community]
n_clusters = 7                   # hyperbolic K-means on train-graph embeddings
max_epochs = 40
init = "kmeans++"                # "kmeans++" | "upstream" (upstream init collapses clusters)
seed = 20261118

[perturbation]
# Cumulative damage: each series is one ordering of the pool; level L removes the
# first round(L * |E|) edges of that ordering, so levels are nested inside a series.
seed = 20261119
damage_fractions = [0.10, 0.20, 0.30]   # fraction of ALL edges
series = 20                             # N independent cumulative series per attack
attacks = ["random", "targeted_weighted", "targeted_deterministic"]
# random                 : uniform ordering of the pool
# targeted_weighted      : ordering sampled without replacement, P ~ k_i * k_j
# targeted_deterministic : k_i * k_j descending (one reference series)

[recovery]
seed = 20261120
t_star = 7
tau_mode = "val_fpr"             # "fixed" (use tau) | "val_fpr" (per method, calibrated on validation)
tau = 0.5                        # used when tau_mode = "fixed"
target_fpr = 0.05                # val_fpr: false-positive rate on validation negatives
sampler = "one_step"             # "iterative" (t* .. 0 reverse loop, upstream-style) | "one_step" (x0 from x_t*)
                                 # | "stochastic" (generalised DDIM, fresh geometric noise each step; Decision 9)
eta = 1.0                        # stochastic only: 0 = deterministic (= iterative), 1 = ancestral-like
steps = 20                       # stochastic only: network calls from t* to 0 (strided schedule)
reconstructions = 10             # K per damaged graph
